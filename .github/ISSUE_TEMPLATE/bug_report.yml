name: Bug report
description: Something in Jano does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Search the [existing issues](https://github.com/ilien-dev/jano/issues?q=is%3Aissue) first.
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The agent and model you used, how you called the skill, and on what kind of repository.
      placeholder: "Claude Code with Opus, /jano on a Rust CLI"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output of build.py if it failed. For a hero that looks or moves wrong, a screenshot or a GIF, and the hero.src.svg if you can share it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jano version
      description: The release you installed, or the commit.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you looked at the hero
      placeholder: "github.com in Chrome on Windows"
  - type: checkboxes
    id: searched
    attributes:
      label: Before opening
      options:
        - label: I searched the existing issues and this one is not reported yet.
          required: true
