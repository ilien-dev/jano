name: Feature request
description: Propose one improvement to Jano.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue. Jano makes a repository's README explain itself: it plans the sections, writes the text to measured rules, draws a looping animated SVG hero and scenes in dark and light, and cuts the social preview from that hero. Ideas outside that purpose will be declined.
        Search the [issues](https://github.com/ilien-dev/jano/issues?q=is%3Aissue) and [pull requests](https://github.com/ilien-dev/jano/pulls?q=is%3Apr) first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I searched the existing issues and pull requests and nobody proposed this yet.
          required: true
        - label: This is a single idea, not several in one issue.
          required: true
        - label: I would like to send the pull request myself.
