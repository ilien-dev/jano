name: Release

# Nobody writes a version number. On every push to main, release-please reads the
# commits since the last release (each one is the title of a squash-merged pull
# request) and keeps one pull request open, "chore(main): release X.Y.Z", with the
# next version in .claude-plugin/plugin.json and the new section of CHANGELOG.md.
# fix: raises the patch number and feat: the minor one; docs, ci, refactor, test and
# chore release nothing. Merging that pull request creates the tag and the GitHub
# Release.
#
# RELEASE_TOKEN is optional: a fine-grained token with write access to contents and
# pull requests. With it the checks run on the release pull request. Without it they
# do not, because GitHub starts no workflow on a pull request opened by a workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
