name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main that
# release-please reads to decide the next version. It must be a Conventional Commit.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            chore
          subjectPattern: ^[a-z0-9].*[^.]$
          subjectPatternError: The text after the type starts in lowercase and has no final period.
