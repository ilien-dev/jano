<!--palette
bg     #0F1115 #F0F5FB
panel  #171A20 #FFFFFF
ink    #F2F0EA #0F1115
body   #C9CDD3 #3A3F48
muted  #A3A8B0 #555B64
accent #4FD1C5 #0B7A70
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Test hero: a title that stays still and three lines that scroll.">
<style>
@keyframes scroll{to{transform:translateY(-96px)}}
@keyframes drift{to{transform:translate(24px,24px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
.scroll{animation:scroll 8s linear infinite}
.drift{animation:drift 4s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.breathe{animation:breathe 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style>
<rect width="1280" height="640" fill="$bg"/>
<rect class="drift" x="-24" y="-24" width="1328" height="688" fill="$panel" opacity=".2"/>
<rect class="breathe" x="72" y="72" width="40" height="40" rx="8" fill="$accent"/>
<text x="128" y="104" class="b" font-size="32" fill="$ink">still title</text>
<text x="128" y="140" class="m pulse" font-size="14" fill="$muted">pulses, does not travel</text>
<g class="scroll" fill="$body">
<text x="640" y="300" class="m" font-size="16">first line</text>
<text x="640" y="332" class="s" font-size="16" text-anchor="middle">second <tspan fill="$accent" class="b">bold</tspan> line</text>
<text class="m" font-size="16" text-anchor="end"><tspan x="900" y="364">third line</tspan><tspan x="900" y="396">first line</tspan></text>
</g>
</svg>
