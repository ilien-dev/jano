<g transform="translate(1144 358)"><use class="t5" href="#tick"/></g>
<g transform="translate(994 358)"><use class="t6" href="#tick"/></g>

<!-- labels -->
<g class="s" font-size="17" fill="$ink" text-anchor="middle">
<text x="650" y="244">Lee el repo</text><text x="800" y="244">Te pregunta</text><text x="950" y="244">Planea</text><text x="1100" y="244">Dibuja</text>
<text x="1100" y="512">Revisa</text><text x="950" y="512">Lectura en frío</text>
</g>

<!-- the finished README at the end of the route -->
