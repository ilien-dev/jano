<!--palette
bg      #0E1628 #EEF2F7
panel   #1B2A4A #FFFFFF
panel2  #142038 #E1E7F0
line    #2F4170 #C5D0E0
dots    #1D2A47 #D5DDE9
ink     #EEF2F7 #1B2A4A
body    #BAC5DB #3F4F73
muted   #8696B8 #5A6A8C
accent  #E8553D #E8553D
hot     #FF8469 #B4381F
tile    #1B2A4A #1B2A4A
ring    #EEF2F7 #EEF2F7
-->
<!--brief
sentence: People who own a repository call Jano once from their AI agent, answer a few questions, and get back a README a stranger understands from top to bottom: planned sections, text sized to fit, a moving picture over the top and over each part that needs one, checked by a reader who never saw the project.
flow: your repo -> read the repo -> ask you (once) -> plan -> draw -> check -> cold read -> a finished README.md
input and output: the repository itself (README, docs, code) -> README.md, assets/hero-dark.svg / hero-light.svg, assets/readme/<name>-dark.svg / -light.svg, assets/readme/plan.json (skills/jano/SKILL.md steps 1-8)
stations: read the repo = SKILL.md step 1; ask you = step 2 (readme.py survey); plan = step 3 (plan.json, readme.py rules); draw = steps 4-6 (build.py); check = step 7 (readme.py check); cold read = step 8 (readme.py judge)
feature "A picture over each section": references/scenes.md
feature "Text sized to fit each part": readme.py rules (word budget per role)
feature "Checked by a reader who never saw it": SKILL.md step 8, the blind and reader judges
feature "Dark and light from one file": build.py writes -dark and -light from one .src.svg
left out as unfinished: nothing (the two survey lines are not features)
strip: none; where it runs is in the badges, and fewer than five list facts remain
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Jano: entra tu repo, sale tu README listo. Un repositorio recorre una ruta de seis estaciones: Jano lee el repo, te pregunta una vez, planea las secciones, dibuja las imágenes, lo revisa todo y se lo da a un lector en frío, y la ruta termina en un README.md listo.">
<style>
@keyframes drift{to{transform:translate(24px,24px)}}
.drift{animation:drift 4.2s linear infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.beat{animation:beat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{animation:flow 1.2s linear infinite}
@keyframes turn{0%{transform:translateY(32px);opacity:0}3%,25.5%{transform:translateY(0);opacity:1}28.5%,100%{transform:translateY(-32px);opacity:0}}
.turn{animation:turn 12s cubic-bezier(.4,0,.2,1) infinite}

/* 12 s  repo   |S1|>|S2|>|S3|>|S4 (folder becomes page)|>corner>|S5|>|S6|>| README |fade|
         lit       each station card lights while the repo rests on its stop
         ticks     each station leaves a tick as the repo departs; all clear at 94-97%
         readme                                                              |glow + done| */
@keyframes trip{
0%{transform:translate(0,0);opacity:0}2%{transform:translate(0,0);opacity:1}
9%{transform:translate(0,0);animation-timing-function:cubic-bezier(.4,0,.2,1)}13%,21%{transform:translate(150px,0);animation-timing-function:cubic-bezier(.4,0,.2,1)}
25%,33%{transform:translate(300px,0);animation-timing-function:cubic-bezier(.4,0,.2,1)}37%,45%{transform:translate(450px,0);animation-timing-function:cubic-bezier(.4,0,1,1)}
49%{transform:translate(550px,0);animation-timing-function:linear}54%{transform:translate(550px,260px);animation-timing-function:cubic-bezier(0,0,.2,1)}
58%,66%{transform:translate(450px,260px);animation-timing-function:cubic-bezier(.4,0,.2,1)}70%,78%{transform:translate(300px,260px);animation-timing-function:cubic-bezier(.4,0,.2,1)}
83%{transform:translate(190px,260px);opacity:1}87%,100%{transform:translate(120px,260px);opacity:0}}
.trip{animation:trip 12s infinite}
@keyframes f1{0%,39%{opacity:1}41%,98%{opacity:0}100%{opacity:1}}
@keyframes f2{0%,39%{opacity:0}41%,96%{opacity:1}98%,100%{opacity:0}}
.f1{animation:f1 12s linear infinite}
.f2{animation:f2 12s linear infinite}
@keyframes on{0%{opacity:0}2%,8%{opacity:1}11%,100%{opacity:0}}
.on{animation:on 12s ease-in-out infinite}
@keyframes glow{0%{opacity:0}3%,12%{opacity:1}16%,100%{opacity:0}}
.glow{animation:glow 12s ease-out infinite}
@keyframes t1{0%,9%{opacity:0;transform:scale(.5)}11%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.5)}}
@keyframes t2{0%,21%{opacity:0;transform:scale(.5)}23%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.5)}}
@keyframes t3{0%,33%{opacity:0;transform:scale(.5)}35%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.5)}}
@keyframes t4{0%,45%{opacity:0;transform:scale(.5)}47%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.5)}}
@keyframes t5{0%,66%{opacity:0;transform:scale(.5)}68%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.5)}}
@keyframes t6{0%,78%{opacity:0;transform:scale(.5)}80%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.5)}}
@keyframes t7{0%,83%{opacity:0;transform:scale(.5)}86%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(.5)}}
.t1,.t2,.t3,.t4,.t5,.t6,.t7{transform-box:fill-box;transform-origin:center}
.t1{animation:t1 12s ease-out infinite}.t2{animation:t2 12s ease-out infinite}.t3{animation:t3 12s ease-out infinite}
.t4{animation:t4 12s ease-out infinite}.t5{animation:t5 12s ease-out infinite}.t6{animation:t6 12s ease-out infinite}.t7{animation:t7 12s ease-out infinite}
@keyframes grow{0%{transform:scaleX(.25)}5%,88%{transform:scaleX(1)}94%,100%{transform:scaleX(.25)}}
.grow{animation:grow 12s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes look{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.look{animation:look 3s ease-in-out infinite}
</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.6" fill="$dots"/></pattern>
<clipPath id="feat"><rect x="44" y="430" width="520" height="48"/></clipPath>
<g id="tick"><circle r="12" fill="$accent"/><path d="M-5.5 0l3.8 3.8 7-7.6" fill="none" stroke="$ring" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="stop"><circle r="9" fill="$bg" stroke="$muted" stroke-width="3"/></g>
</defs>
<rect width="1280" height="640" fill="$bg"/>
<g id="backdrop"><rect class="drift" x="-24" y="-24" width="1328" height="688" fill="url(#grid)"/></g>

<!-- text block -->
<g id="logo">
<rect x="48" y="112" width="56" height="56" rx="12.25" fill="$tile" stroke="$line" stroke-width="1.5"/>
<g transform="translate(53.6 117.6) scale(.175)"><path fill="$ring" d="M172 48L176 48A56 56 0 0 1 232 104L232 152A56 56 0 0 1 176 208L80 208A56 56 0 0 1 24 152L24 104A56 56 0 0 1 80 48L104 48L104 92L80 92A12 12 0 0 0 68 104L68 152A12 12 0 0 0 80 164L176 164A12 12 0 0 0 188 152L188 104A12 12 0 0 0 176 92L172 92Z"/><path class="beat" fill="$accent" d="M114 70A24 24 0 1 0 162 70A24 24 0 1 0 114 70Z"/></g>
</g>
<text id="name" class="b" x="118" y="152" font-size="34" fill="$ink">Jano</text>
<text id="tagline" class="b" font-size="44" fill="$ink"><tspan x="48" y="240">Entra tu repo.</tspan><tspan x="48" y="294" fill="$hot">Sale tu README listo.</tspan></text>
<text id="about" class="s" font-size="19" fill="$body"><tspan x="48" y="346">Un skill de agente que planea tu README, lo escribe</tspan><tspan x="48" y="373">a la medida y dibuja una imagen viva en cada parte.</tspan></text>
<g id="facts">
<rect x="48" y="412" width="200" height="2" fill="$line"/><rect x="48" y="412" width="56" height="2" fill="$accent"/>
<g clip-path="url(#feat)">
<g class="turn" opacity="0" style="animation-delay:-9s"><circle cx="56" cy="456" r="7" fill="$accent"/><text x="76" y="464" class="s" font-size="22" fill="$ink">Una imagen sobre cada sección</text></g>
<g class="turn" opacity="0" style="animation-delay:-6s"><circle cx="56" cy="456" r="7" fill="$accent"/><text x="76" y="464" class="s" font-size="22" fill="$ink">Texto a la medida de cada parte</text></g>
<g class="turn" opacity="0" style="animation-delay:-3s"><circle cx="56" cy="456" r="7" fill="$accent"/><text x="76" y="464" class="s" font-size="22" fill="$ink">Lo revisa alguien que nunca lo vio</text></g>
<g class="turn" style="animation-delay:0s"><circle cx="56" cy="456" r="7" fill="$accent"/><text x="76" y="464" class="s" font-size="22" fill="$ink">Oscuro y claro desde un archivo</text></g>
</g>
</g>

<g id="stage">
<!-- the route: a track, walking dashes, chevrons that give its direction -->
<path d="M650 200H1180a30 30 0 0 1 30 30v200a30 30 0 0 1-30 30H862" fill="none" stroke="$line" stroke-width="8" stroke-linecap="round"/>
<path class="flow" d="M650 200H1180a30 30 0 0 1 30 30v200a30 30 0 0 1-30 30H862" fill="none" stroke="$muted" stroke-width="2.5" stroke-dasharray="8 16"/>
<g fill="none" stroke="$muted" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M721 193l7 7-7 7"/><path d="M871 193l7 7-7 7"/><path d="M1021 193l7 7-7 7"/>
<path d="M1203 326l7 7 7-7"/><path d="M1029 453l-7 7 7 7"/><path d="M879 453l-7 7 7 7"/>
</g>

<!-- station cards, above their stop -->
<g stroke-width="1.5">
<rect x="600" y="92" width="100" height="80" rx="14" fill="$panel" stroke="$line"/>
<rect x="750" y="92" width="100" height="80" rx="14" fill="$panel" stroke="$line"/>
<rect x="900" y="92" width="100" height="80" rx="14" fill="$panel" stroke="$line"/>
<rect x="1050" y="92" width="100" height="80" rx="14" fill="$panel" stroke="$line"/>
<rect x="1050" y="352" width="100" height="80" rx="14" fill="$panel" stroke="$line"/>
<rect x="900" y="352" width="100" height="80" rx="14" fill="$panel" stroke="$line"/>
</g>
