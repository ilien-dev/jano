<!-- the repo that travels: a folder, then a page with a picture once it is drawn -->
<g transform="translate(650 200)"><g class="trip" opacity="0"><g transform="scale(1.2)">
<g class="f1"><path d="M-18 -14h12l4 5h20a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3h-36a3 3 0 0 1-3-3v-23a3 3 0 0 1 3-3z" fill="$accent" stroke="$bg" stroke-width="2"/></g>
<g class="f2"><rect x="-15" y="-19" width="30" height="38" rx="4" fill="$accent" stroke="$bg" stroke-width="2"/><path d="M-9 8l6-7 5 4 4-3 5 6" fill="none" stroke="$ring" stroke-width="2" stroke-linejoin="round"/><rect x="-9" y="-12" width="18" height="3.5" rx="1.75" fill="$ring"/></g>
</g></g></g>
</g>
</svg>
