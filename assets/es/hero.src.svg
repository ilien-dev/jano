<g fill="none" stroke="$accent" stroke-width="3">
<rect class="on" opacity="0" style="animation-delay:0s" x="600" y="92" width="100" height="80" rx="14"/>
<rect class="on" opacity="0" style="animation-delay:-10.44s" x="750" y="92" width="100" height="80" rx="14"/>
<rect class="on" opacity="0" style="animation-delay:-9s" x="900" y="92" width="100" height="80" rx="14"/>
<rect class="on" opacity="0" style="animation-delay:-7.56s" x="1050" y="92" width="100" height="80" rx="14"/>
<rect class="on" opacity="0" style="animation-delay:-5.04s" x="1050" y="352" width="100" height="80" rx="14"/>
<rect class="on" opacity="0" style="animation-delay:-3.6s" x="900" y="352" width="100" height="80" rx="14"/>
</g>

<!-- 1 read the repo: a folder of files under a lens -->
<path d="M620 118h20l6 6h30a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4h-56a4 4 0 0 1-4-4v-34a4 4 0 0 1 4-4z" fill="$panel2" stroke="$muted" stroke-width="2"/>
<rect x="626" y="134" width="30" height="4" rx="2" fill="$muted"/><rect x="626" y="144" width="22" height="4" rx="2" fill="$muted"/>
<g class="look"><circle cx="668" cy="140" r="10" fill="none" stroke="$ink" stroke-width="3"/><path d="M675 147l8 8" stroke="$ink" stroke-width="3.5" stroke-linecap="round"/></g>

<!-- 2 ask you: a question with two answers to pick -->
