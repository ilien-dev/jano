<text class="b" x="792" y="131" font-size="20" fill="$ink" text-anchor="middle">?</text>
<rect x="804" y="146" width="34" height="14" rx="7" fill="$accent"/><rect x="804" y="146" width="34" height="14" rx="7" fill="none"/>
<rect x="764" y="152" width="30" height="12" rx="6" fill="none" stroke="$muted" stroke-width="2"/>

<!-- 3 plan: rows, each with a role and a budget -->
<g><rect x="914" y="106" width="16" height="12" rx="3" fill="$accent"/><rect class="grow" style="animation-delay:-9s" x="936" y="109" width="48" height="6" rx="3" fill="$muted"/>
<rect x="914" y="126" width="16" height="12" rx="3" fill="$muted"/><rect class="grow" style="animation-delay:-8.8s" x="936" y="129" width="34" height="6" rx="3" fill="$muted"/>
<rect x="914" y="146" width="16" height="12" rx="3" fill="$muted"/><rect class="grow" style="animation-delay:-8.6s" x="936" y="149" width="42" height="6" rx="3" fill="$muted"/></g>

<!-- 4 draw: a picture with a pen -->
<rect x="1066" y="106" width="56" height="52" rx="6" fill="$panel2" stroke="$muted" stroke-width="2"/>
<path d="M1072 150l14-16 10 10 8-7 12 13" fill="none" stroke="$accent" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1108" cy="120" r="5" fill="$ink"/>
<path d="M1124 152l14-26 6 3-14 26-7 3z" fill="$ink"/>

<!-- 5 check: a checklist -->
<g><rect x="1066" y="366" width="14" height="14" rx="3" fill="$accent"/><rect x="1088" y="370" width="46" height="6" rx="3" fill="$muted"/>
<rect x="1066" y="386" width="14" height="14" rx="3" fill="$accent"/><rect x="1088" y="390" width="36" height="6" rx="3" fill="$muted"/>
<rect x="1066" y="406" width="14" height="14" rx="3" fill="none" stroke="$muted" stroke-width="2"/><rect x="1088" y="410" width="42" height="6" rx="3" fill="$muted"/></g>

<!-- 6 cold read: an eye that sees only a picture -->
<rect x="916" y="398" width="68" height="24" rx="5" fill="$panel2" stroke="$muted" stroke-width="2"/>
<path d="M922 416l12-10 9 7 8-5 12 8" fill="none" stroke="$muted" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M922 380q28-24 56 0q-28 24-56 0z" fill="$panel2" stroke="$ink" stroke-width="2.5"/>
<circle class="look" cx="950" cy="380" r="7" fill="$accent"/>

<!-- stops and ticks -->
<use href="#stop" x="650" y="200"/><use href="#stop" x="800" y="200"/><use href="#stop" x="950" y="200"/><use href="#stop" x="1100" y="200"/>
<use href="#stop" x="1100" y="460"/><use href="#stop" x="950" y="460"/>
<g transform="translate(694 98)"><use class="t1" href="#tick"/></g>
<g transform="translate(844 98)"><use class="t2" href="#tick"/></g>
