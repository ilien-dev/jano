<!-- text block -->
<g id="logo" transform="translate(72 60) scale(0.21875)"><rect width="256" height="256" rx="56" fill="$tile"/><g transform="translate(25.6 25.6) scale(.8)"><path fill="$door" d="M172 48L176 48A56 56 0 0 1 232 104L232 152A56 56 0 0 1 176 208L80 208A56 56 0 0 1 24 152L24 104A56 56 0 0 1 80 48L104 48L104 92L80 92A12 12 0 0 0 68 104L68 152A12 12 0 0 0 80 164L176 164A12 12 0 0 0 188 152L188 104A12 12 0 0 0 176 92L172 92Z"/><path fill="$mark" d="M114 70A24 24 0 1 0 162 70A24 24 0 1 0 114 70Z"/></g></g>
<text id="name" x="144" y="102" class="b" font-size="40" fill="$ink">Jano</text>
<text id="tagline" class="b" font-size="56" fill="$ink"><tspan x="72" y="226">A README that</tspan><tspan x="72" y="290" fill="$accent">explains itself.</tspan></text>
<text id="about" class="s" font-size="20" fill="$body"><tspan x="72" y="346">A skill for your AI assistant. It writes your</tspan><tspan x="72" y="376">project's front page and draws its pictures.</tspan></text>
<g id="facts"><g clip-path="url(#feat)">
<g class="turn" opacity="0" style="animation-delay:-9s"><circle cx="82" cy="444" r="6" fill="$accent"/><text x="100" y="451" class="s" font-size="20" fill="$ink">Pictures that move</text></g>
<g class="turn" opacity="0" style="animation-delay:-6s"><circle cx="82" cy="444" r="6" fill="$accent"/><text x="100" y="451" class="s" font-size="20" fill="$ink">Dark and light, both ready</text></g>
<g class="turn" opacity="0" style="animation-delay:-3s"><circle cx="82" cy="444" r="6" fill="$accent"/><text x="100" y="451" class="s" font-size="20" fill="$ink">Your colours kept</text></g>
<g class="turn" style="animation-delay:0s"><circle cx="82" cy="444" r="6" fill="$accent"/><text x="100" y="451" class="s" font-size="20" fill="$ink">Plays on GitHub, nothing to host</text></g>
</g></g>

