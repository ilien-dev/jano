<circle cx="912" cy="314" r="46" fill="$panel" stroke="$line" stroke-width="2"/>
<circle class="pulse" cx="912" cy="314" r="46" fill="none" stroke="$accent" stroke-width="3"/>
<g transform="translate(892 294) scale(0.15625)"><rect width="256" height="256" rx="56" fill="$tile"/><g transform="translate(25.6 25.6) scale(.8)"><path fill="$door" d="M172 48L176 48A56 56 0 0 1 232 104L232 152A56 56 0 0 1 176 208L80 208A56 56 0 0 1 24 152L24 104A56 56 0 0 1 80 48L104 48L104 92L80 92A12 12 0 0 0 68 104L68 152A12 12 0 0 0 80 164L176 164A12 12 0 0 0 188 152L188 104A12 12 0 0 0 176 92L172 92Z"/><path fill="$mark" d="M114 70A24 24 0 1 0 162 70A24 24 0 1 0 114 70Z"/></g></g>
