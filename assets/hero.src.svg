<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Jano: your repo, explained before a word is read. At the top of a README, Jano draws a poster part by part; build.py measures it (text size, contrast, loop, speed, file size) and writes hero-dark.svg and hero-light.svg.">
<style>
@keyframes drift{to{transform:translate(24px,24px)}}
.drift{animation:drift 4.2s linear infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.beat{animation:beat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{animation:flow 1.2s linear infinite}
@keyframes bob{0%,100%{transform:translateX(0)}50%{transform:translateX(74px)}}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes lit{0%,80%{opacity:0}85%,96%{opacity:1}100%{opacity:0}}
@keyframes tick{to{transform:translateX(-2313.6px)}}
.tick{animation:tick 37.3s linear infinite}

/* 12 s  pen     |name|key|about|facts|== picture ==|strip|-> build.py|
         parts   each one goes just before the pen redraws it
         scan                                          |== across ==|
         checks                                            |1|2|3|4|5|
         files                                                     |glow| */
@keyframes pen{0%{transform:translate(0,0);opacity:0}2%,6%{transform:translate(0,0);opacity:1}10%,14%{transform:translate(44px,36px);opacity:1}18%,22%{transform:translate(54px,72px);opacity:1}26%,30%{transform:translate(26px,102px);opacity:1}36%,42%{transform:translate(254px,26px);opacity:1}48%,50%{transform:translate(160px,146px);opacity:1}56%,58%{transform:translate(428px,-38px);opacity:1}61%,100%{transform:translate(428px,-38px);opacity:0}}
.pen{animation:pen 12s cubic-bezier(.4,0,.2,1) infinite}
@keyframes draw{0%{opacity:0;transform:scaleX(.25)}4%,94%{opacity:1;transform:scaleX(1)}97%,100%{opacity:0;transform:scaleX(.25)}}
.draw{animation:draw 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes scan{0%,50%{transform:translateX(0);opacity:0}52%{transform:translateX(0);opacity:1}62%{transform:translateX(410px);opacity:1}64%,100%{transform:translateX(410px);opacity:0}}
.scan{animation:scan 12s linear infinite}
@keyframes ok{0%{opacity:1;transform:scale(1.3)}3%,92%{opacity:1;transform:scale(1)}95%,98%{opacity:.15;transform:scale(1)}100%{opacity:1;transform:scale(1.3)}}
.ok{animation:ok 12s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes belt{to{transform:translateX(-96px)}}
.belt{animation:belt 4.8s linear infinite}
.glow{animation:lit 12s ease-out infinite}
@keyframes turn{0%{transform:translateY(32px);opacity:0}3%,25.5%{transform:translateY(0);opacity:1}28.5%,100%{transform:translateY(-32px);opacity:0}}
.turn{animation:turn 12s cubic-bezier(.4,0,.2,1) infinite}
</style>
