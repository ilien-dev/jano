<!--palette
bg     #0E1526 #F5F7FB
panel  #172138 #FFFFFF
raised #22304F #E6ECF5
line   #34446A #C9D3E3
ink    #EEF2F7 #1B2A4A
body   #C3CBD9 #3A4560
muted  #95A0B6 #586380
accent #E8553D #C23B25
warm   #3A2333 #FBE1DB
dots   #1E2A44 #DDE4EF
tile   #1B2A4A #1B2A4A
door   #EEF2F7 #EEF2F7
mark   #E8553D #E8553D
-->
<!--brief
Sentence: someone who made a project asks their AI assistant once, answers a few questions, and gets a GitHub front page that explains itself: plain text and moving pictures, in dark and light, in their own colours.
Input and output: a project folder (any repository) goes in; README.md with assets/hero-dark.svg, assets/hero-light.svg and assets/readme/<name>-dark|light.svg comes out (skills/jano/SKILL.md steps 5-7, scripts/build.py writes the two themes).
Pictures that move: CSS keyframes in every picture (references/motion.md, scripts/build.py).
Dark and light: build.py writes -dark.svg and -light.svg from one source.
Your colours kept: SKILL.md step 1, "Look for an existing identity ... reuse its colors, mark and rules".
Plays on GitHub, nothing to host: plain SVG with CSS only (references/hero.md, Format).
Left out as unfinished: nothing in the skill is marked unfinished; the survey's one line is the word "planned" in a sentence.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Jano: a README that explains itself. A parcel leaves your project folder, passes through Jano, and lands on a README.md page, where a moving picture appears at the top and a picture over each part.">
<style>
/* 12 s story
   rows     |r1|r2|r3|                                   (2-16%)
   parcel1  |--to jano--|                                (0-18%)
   jano           |pulse|                                (17-30%)
   parcel2               |--to page--|                   (30-42%)
   banner                            |in|=====shown=====|out| (42-46, 88-92)
   pic1                                 |in|===shown===|out|  (48-52, 91-95)
   pic2                                    |in|==shown==|out| (54-58, 94-98)  */
@keyframes drift{to{transform:translate(24px,24px)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes p1{0%{transform:translateX(0);opacity:0}3%{transform:translateX(0);opacity:1}15%{transform:translateX(138px);opacity:1}18%,100%{transform:translateX(138px);opacity:0}}
@keyframes p2{0%,29%{transform:translate(0,0);opacity:0}31%{transform:translate(0,0);opacity:1}40%{transform:translate(216px,-112px);opacity:1}43%,100%{transform:translate(216px,-112px);opacity:0}}
@keyframes row1{0%,2%{opacity:0}4%,8%{opacity:1}11%,100%{opacity:0}}
@keyframes row2{0%,7%{opacity:0}9%,13%{opacity:1}16%,100%{opacity:0}}
@keyframes row3{0%,12%{opacity:0}14%,18%{opacity:1}21%,100%{opacity:0}}
@keyframes pulse{0%,16%{transform:scale(1);opacity:0}19%{transform:scale(1);opacity:1}28%{transform:scale(1.3);opacity:0}100%{transform:scale(1.3);opacity:0}}
@keyframes ban{0%,42%{opacity:0;transform:translateY(12px)}46%,88%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(12px)}}
@keyframes pa{0%,48%{opacity:0;transform:translateY(12px)}52%,91%{opacity:1;transform:translateY(0)}95%,100%{opacity:0;transform:translateY(12px)}}
@keyframes pb{0%,54%{opacity:0;transform:translateY(12px)}58%,94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(12px)}}
@keyframes roam{0%,100%{transform:translateX(0)}50%{transform:translateX(150px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes turn{0%{transform:translateY(32px);opacity:0}4%,25%{transform:translateY(0);opacity:1}29%,100%{transform:translateY(-32px);opacity:0}}
.drift{animation:drift 6s linear infinite}
.flow{animation:flow 1.2s linear infinite}
.p1{animation:p1 12s cubic-bezier(.4,0,.2,1) infinite}
.p2{animation:p2 12s cubic-bezier(.4,0,.2,1) infinite}
.row1{animation:row1 12s ease-in-out infinite}
.row2{animation:row2 12s ease-in-out infinite}
.row3{animation:row3 12s ease-in-out infinite}
.pulse{animation:pulse 12s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ban{animation:ban 12s cubic-bezier(0,0,.2,1) infinite}
.pa{animation:pa 12s cubic-bezier(0,0,.2,1) infinite}
.pb{animation:pb 12s cubic-bezier(0,0,.2,1) infinite}
.roam{animation:roam 4s ease-in-out infinite}
.bob{animation:bob 3s ease-in-out infinite}
.turn{animation:turn 12s cubic-bezier(.4,0,.2,1) infinite}
</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.6" fill="$dots"/></pattern>
<clipPath id="feat"><rect x="68" y="420" width="500" height="48"/></clipPath>
<clipPath id="banclip"><rect x="1020" y="150" width="216" height="104" rx="10"/></clipPath>
</defs>
<rect width="1280" height="640" fill="$bg"/>
