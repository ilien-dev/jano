<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="Who it is for: three small front pages side by side, each in its own colours. A light moves from one to the next: on Anzu, a book loses its lock and becomes an EPUB file; on Sharur, a long reply shrinks to a short one; on Svipall, a page gets through a wall to an AI agent. Under each, the kind of project: a book app, a writing style for AI, a web tool for AI.">
<style>
/* 15 s story
   ringA  |=====|                 (0-33%)   anzu: lock off 8-11, book to file 12-22, file in 21-24
   ringB        |=====|           (33-66%)  sharur: long out 38-42, short in 40-44
   ringC              |=====|     (66-99%)  svipall: page through wall 70-84, agent lit 84-95 */
@keyframes drift{to{transform:translate(24px,24px)}}
@keyframes ra{0%,30%{opacity:1}33%,97%{opacity:0}100%{opacity:1}}
@keyframes rb{0%,31%{opacity:0}34%,63%{opacity:1}66%,100%{opacity:0}}
@keyframes rc{0%,64%{opacity:0}67%,96%{opacity:1}99%,100%{opacity:0}}
@keyframes lock{0%,14%{opacity:1}17%,95%{opacity:0}98%,100%{opacity:1}}
@keyframes pa{0%,16%{transform:translateX(0);opacity:0}18%{transform:translateX(0);opacity:1}26%{transform:translateX(92px);opacity:1}28%,100%{transform:translateX(92px);opacity:0}}
@keyframes file{0%,26%{opacity:.55}29%,95%{opacity:1}98%,100%{opacity:.55}}
@keyframes long{0%,46%{opacity:1}50%,95%{opacity:0}98%,100%{opacity:1}}
@keyframes short{0%,48%{opacity:0}52%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes pc{0%,75%{transform:translateX(0);opacity:0}77%{transform:translateX(0);opacity:1}87%{transform:translateX(-112px);opacity:1}90%,100%{transform:translateX(-112px);opacity:0}}
@keyframes glow{0%,88%{opacity:0}90%,95%{opacity:1}98%,100%{opacity:0}}
.drift{animation:drift 6s linear infinite}
.ra{animation:ra 15s ease-in-out infinite}
.rb{animation:rb 15s ease-in-out infinite}
.rc{animation:rc 15s ease-in-out infinite}
.lock{animation:lock 15s ease-in-out infinite}
.pa{animation:pa 15s cubic-bezier(.4,0,.2,1) infinite}
.file{animation:file 15s ease-out infinite}
.long{animation:long 15s ease-in-out infinite}
.short{animation:short 15s ease-in-out infinite}
.pc{animation:pc 15s cubic-bezier(.4,0,.2,1) infinite}
.glow{animation:glow 15s ease-out infinite}
@keyframes send{0%{transform:translateX(0);opacity:0}1%{transform:translateX(0);opacity:1}6%{transform:translateX(316px);opacity:1}8%,100%{transform:translateX(316px);opacity:0}}
@keyframes beat{0%{transform:scale(1);opacity:0}4%{transform:scale(1);opacity:.9}34%,100%{transform:scale(1.35);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.send{animation:send 15s cubic-bezier(.4,0,.2,1) infinite}
.beat{animation:beat 5s ease-out -0.9s infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.2s linear infinite}
@keyframes sa{0%{transform:translate(0,0);opacity:0}1%{transform:translate(0,0);opacity:1}11%{transform:translate(454px,-190px);opacity:1}13%,100%{transform:translate(454px,-190px);opacity:0}}
.sa{animation:sa 15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sb{0%{transform:translate(0,0);opacity:0}1%{transform:translate(0,0);opacity:1}11%{transform:translate(701px,-190px);opacity:1}13%,100%{transform:translate(701px,-190px);opacity:0}}
.sb{animation:sb 15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sc{0%{transform:translate(0,0);opacity:0}1%{transform:translate(0,0);opacity:1}11%{transform:translate(947px,-190px);opacity:1}13%,100%{transform:translate(947px,-190px);opacity:0}}
.sc{animation:sc 15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes cova{0%,6%{opacity:1}9%,92%{opacity:0}95%,100%{opacity:1}}
@keyframes covb{0%,39%{opacity:1}42%,94%{opacity:0}97%,100%{opacity:1}}
@keyframes covc{0%,72%{opacity:1}75%,96%{opacity:0}99%,100%{opacity:1}}
.cova{animation:cova 15s ease-in-out infinite}
.covb{animation:covb 15s ease-in-out infinite}
.covc{animation:covc 15s ease-in-out infinite}
</style>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.6" fill="$dots"/></pattern></defs>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop"><rect class="drift" x="-24" y="-24" width="1328" height="496" fill="url(#grid)"/></g>

<text id="eyebrow" x="72" y="56" class="m" font-size="15" letter-spacing="3" fill="$accent">WHO IT IS FOR</text>
<text id="title" class="b" font-size="42" fill="$ink"><tspan x="72" y="108">Any project,</tspan><tspan x="72" y="158">its own picture</tspan></text>
<text id="sub" class="s" font-size="19" fill="$body"><tspan x="72" y="200">Three real projects, each drawn</tspan><tspan x="72" y="226">in its own colours.</tspan></text>

