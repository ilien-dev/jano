<!--palette
bg      #0E1628 #EEF2F7
panel   #1B2A4A #FFFFFF
panel2  #142038 #E1E7F0
line    #2F4170 #C5D0E0
dots    #1D2A47 #D5DDE9
ink     #EEF2F7 #1B2A4A
body    #BAC5DB #3F4F73
muted   #8696B8 #5A6A8C
accent  #E8553D #E8553D
hot     #FF8469 #B4381F
ring    #EEF2F7 #EEF2F7
onacc   #0E1628 #0E1628
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="How it works, the cold read: a section picture has its words cut away, only the picture goes to a blind reader who never saw the project, the reader writes what it shows, and that answer is held against the claim in claims.json: it matches, so the picture passes; a miss would send it back to be redrawn.">
<style>
@keyframes drift{to{transform:translate(24px,24px)}}
.drift{animation:drift 4.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{animation:flow 1.2s linear infinite}
@keyframes look{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.look{animation:look 3s ease-in-out infinite}

/* 16 s  words   |==shown==|cut away|.........................................|back|
         copy              |--travels to the reader--|
         thumb                                  |in|===== seen ===============|out|
         answer                                    |--typed--|==== rests ======|
         claim                                               |lit|
         verdict                                                 |pass|=======|out| */
@keyframes words{0%,14%{opacity:1;transform:translateY(0)}20%,92%{opacity:0;transform:translateY(-16px)}97%,100%{opacity:1;transform:translateY(0)}}
.words{animation:words 16s cubic-bezier(.4,0,.2,1) infinite}
@keyframes copy{0%,22%{opacity:0;transform:translate(0,0) scale(1.25)}24%{opacity:1;transform:translate(0,0) scale(1.25);animation-timing-function:cubic-bezier(.4,0,.2,1)}34%{opacity:1;transform:translate(350px,-28px) scale(1)}37%,100%{opacity:0;transform:translate(350px,-28px) scale(1)}}
.copy{animation:copy 16s infinite;transform-box:fill-box;transform-origin:0 0}
@keyframes thumb{0%,33%{opacity:0}36%,92%{opacity:1}96%,100%{opacity:0}}
.thumb{animation:thumb 16s ease-out infinite}
@keyframes type{0%,38%{transform:translateX(-280px);animation-timing-function:steps(30,end)}52%,92%{transform:translateX(0)}96%,100%{transform:translateX(-280px)}}
.type{animation:type 16s linear infinite}
@keyframes lit{0%,53%{opacity:0}56%,66%{opacity:1}72%,100%{opacity:0}}
.lit{animation:lit 16s ease-in-out infinite}
@keyframes pass{0%,60%{opacity:0;transform:scale(.6)}63%,92%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(.6)}}
.pass{animation:pass 16s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes dim{0%,60%{opacity:1}63%,92%{opacity:.55}96%,100%{opacity:1}}
.dim{animation:dim 16s ease-in-out infinite}
</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.6" fill="$dots"/></pattern>
<clipPath id="ans"><rect x="470" y="352" width="300" height="24"/></clipPath>
<g id="pic">
<rect width="140" height="80" rx="8" fill="$bg" stroke="$line" stroke-width="1.5"/>
<path d="M14 12h66a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6h-50l-8 7v-7h-8a6 6 0 0 1-6-6v-18a6 6 0 0 1 6-6z" fill="$panel2" stroke="$muted" stroke-width="2"/>
<rect x="22" y="22" width="44" height="6" rx="3" fill="$muted"/><rect x="22" y="32" width="28" height="5" rx="2.5" fill="$muted"/>
<rect x="74" y="56" width="52" height="16" rx="8" fill="$accent"/><rect x="14" y="56" width="52" height="16" rx="8" fill="none" stroke="$muted" stroke-width="2"/>
</g>
</defs>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop"><rect class="drift" x="-24" y="-24" width="1328" height="496" fill="url(#grid)"/></g>

<text id="eyebrow" class="m" x="56" y="56" font-size="15" fill="$hot" letter-spacing="2">HOW IT WORKS</text>
<text id="title" class="b" x="56" y="108" font-size="42" fill="$ink">Each picture faces a stranger first</text>
<text id="sub" class="s" x="56" y="146" font-size="20" fill="$body">Its words are cut away. If the reader misses, it is redrawn.</text>

<g id="stage">
<!-- 1 the section picture, with its words above a cut line -->
<text class="m" x="56" y="186" font-size="16" fill="$muted">ask-dark.svg</text>
<rect x="56" y="200" width="316" height="216" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/>
<rect x="72" y="212" width="232" height="38" rx="6" fill="none" stroke="$line" stroke-width="1.5" stroke-dasharray="5 5"/>
<g class="words" opacity="0"><rect x="76" y="216" width="70" height="7" rx="3" fill="$hot"/><rect x="76" y="232" width="210" height="13" rx="4" fill="$ink"/></g>
<path d="M68 262H360" stroke="$muted" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="62" y="248" width="32" height="28" rx="6" fill="$panel"/><g data-asset="lucide:scissors" data-icon="cut away" data-size="24" transform="translate(66 250) scale(1)" color="$muted"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12L12 12m8-8L8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8L20 20"/></g></g>
<g transform="translate(126 284) scale(1.25)"><use href="#pic"/></g>

<!-- connectors -->
<path class="flow" d="M384 306H434" fill="none" stroke="$muted" stroke-width="2.5" stroke-dasharray="8 16"/>
<path d="M430 298l8 8-8 8" fill="none" stroke="$muted" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="flow" d="M808 306H858" fill="none" stroke="$muted" stroke-width="2.5" stroke-dasharray="8 16"/>
<path d="M854 298l8 8-8 8" fill="none" stroke="$muted" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- 2 the blind reader: a window that sees the picture and nothing else -->
<rect x="448" y="200" width="348" height="216" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/>
<path d="M448 236v-22a14 14 0 0 1 14-14h320a14 14 0 0 1 14 14v22z" fill="$panel2"/>
<path d="M464 218q14-12 28 0q-14 12-28 0z" fill="none" stroke="$ink" stroke-width="2"/><circle class="look" cx="478" cy="218" r="3.5" fill="$accent"/>
<text class="m" x="502" y="224" font-size="16" fill="$ink">blind reader</text>
<rect x="464" y="248" width="164" height="94" rx="10" fill="$bg" stroke="$line" stroke-width="1.5" stroke-dasharray="5 5"/>
<g class="thumb"><use href="#pic" x="476" y="256"/></g>
<text class="s" x="646" y="274" font-size="16" fill="$muted">sees only</text>
<text class="s" x="646" y="296" font-size="16" fill="$muted">the picture</text>
<text class="m" x="474" y="370" font-size="15" fill="$ink">It asks a few questions, once.</text>
<g clip-path="url(#ans)"><rect class="type" x="750" y="352" width="300" height="24" fill="$panel"/></g>
<rect x="464" y="388" width="120" height="5" rx="2.5" fill="$line"/>

<!-- 3 the claim, and the verdict -->
<rect x="872" y="200" width="356" height="216" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/>
<path d="M872 236v-22a14 14 0 0 1 14-14h328a14 14 0 0 1 14 14v22z" fill="$panel2"/>
<text class="m" x="890" y="224" font-size="16" fill="$ink">claims.json</text>
<rect x="888" y="250" width="324" height="64" rx="8" fill="$bg" stroke="$line" stroke-width="1.5"/>
<rect class="lit" opacity="0" x="888" y="250" width="324" height="64" rx="8" fill="none" stroke="$accent" stroke-width="3"/>
<text class="s" x="902" y="276" font-size="16" fill="$body">You answer a few questions</text>
<text class="s" x="902" y="300" font-size="16" fill="$body">once, then it works alone.</text>
<g class="pass"><rect x="888" y="340" width="120" height="44" rx="22" fill="$accent"/><path d="M906 362l6 6 11-12" fill="none" stroke="$onacc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="b" x="934" y="369" font-size="18" fill="$onacc">pass</text></g>
<g class="dim"><rect x="1024" y="341" width="136" height="42" rx="21" fill="none" stroke="$muted" stroke-width="2"/><g data-asset="lucide:rotate-cw" data-icon="redraw" data-size="24" transform="translate(1036 350) scale(1)" color="$muted"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></g></g><text class="b" x="1070" y="368" font-size="18" fill="$body">redraw</text></g>

<!-- the picture alone, on its way to the reader -->
<g transform="translate(126 284)"><g class="copy" opacity="0"><use href="#pic"/></g></g>
</g>
</svg>
